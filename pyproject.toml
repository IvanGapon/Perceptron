[project]
name = "perceptron"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "IGapone", email = "vangapone40@email.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.2.0",
    "mypy>=1.0.0",
]

[project.scripts]
perceptrone = "perceptron:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

